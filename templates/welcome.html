<!DOCTYPE html>
<html>
<head>
<title>Welcome - Predict AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f8f9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#f8f9ff;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif;overflow:hidden;padding:16px;box-sizing:border-box}
.card{width:100%;max-width:380px;background:#ffffff;border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 12px 40px rgba(47,128,255,0.15);border:1px solid #eef2ff;animation:slideUp 0.6s ease;box-sizing:border-box}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.icon-box{width:80px;height:80px;background:linear-gradient(135deg,#6bb6ff,#2f80ff);border-radius:20px;display:flex;justify-content:center;align-items:center;margin:0 auto 18px auto;box-shadow:0 8px 20px rgba(47,128,255,0.3);animation:pop 0.8s ease 0.3s both}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.icon-box span{font-size:42px;color:white}
.success-badge{background:#e6f7ec;color:#1a8a3a;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;margin-bottom:16px;letter-spacing:0.5px}
.welcome-title{font-size:13px;color:#8a9bb5;letter-spacing:3px;text-transform:uppercase;font-weight:600;margin:0 0 8px 0}
.main-heading{font-size:24px;font-weight:800;color:#121a2b;line-height:1.3;margin:0 0 10px 0}
.main-heading span{background:linear-gradient(90deg,#2f80ff,#6bb6ff);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.desc{font-size:12px;color:#6b7b99;line-height:1.6;margin:0 0 26px 0}
.continue-btn{width:100%;padding:14px;background:linear-gradient(90deg,#6bb6ff,#2f80ff);border:none;border-radius:12px;color:white;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(47,128,255,0.3);transition:0.2s}
.continue-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(47,128,255,0.4)}
.user-name{font-size:12px;color:#2f80ff;font-weight:600;margin-top:14px}
/* Design change 0% - bas mobile pe fit */
@media (max-width:400px){
  .card{padding:28px 20px;border-radius:20px}
  .main-heading{font-size:20px}
  .icon-box{width:68px;height:68px}
  .icon-box span{font-size:36px}
}
</style>
</head>
<body>
<div class="card">
  <div class="icon-box"><span>⌬</span></div>
  <div class="success-badge">✓ SUCCESSFULLY LOGGED IN</div>
  <p class="welcome-title">Welcome</p>
  <h1 class="main-heading">WELCOME TO OUR <br><span>AI SMART DISEASE PREDICTION SYSTEM</span></h1>
  <p class="desc">Your health is our priority. Let's start your smart diagnosis journey with Predict AI.</p>
  <button class="continue-btn" onclick="window.location.href='/mark_welcome_done'">Continue to Diagnosis →</button>
  <p class="user-name">Hi, {{ user }} 👋</p>
</div>
<script>
let colors = ['#2f80ff','#6bb6ff','#e6f7ec'];
for(let i=0;i<30;i++){
  let c = document.createElement('div');
  c.style.position='absolute'; c.style.width='8px'; c.style.height='8px';
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.borderRadius='50%'; c.style.left=Math.random()*100+'vw'; c.style.top='-10px';
  c.style.animation=`fall ${2+Math.random()*3}s linear ${Math.random()}s forwards`;
  document.body.appendChild(c);
}
let style = document.createElement('style');
style.innerHTML=`@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}`;
document.head.appendChild(style);
</script>
</body>
</html>
