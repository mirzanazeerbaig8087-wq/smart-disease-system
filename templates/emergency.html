<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency - Predict AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0; background:#0a1220; font-family:'Poppins',sans-serif; color:#fff; padding:0; }
.topBar{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:rgba(11,14,24,0.95); border-bottom:1px solid #1e2436; position:sticky; top:0; z-index:20; }
.brand-main{font-size:16px;font-weight:800;background:linear-gradient(90deg,#ff6b6b,#ff8a8a);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.badge{background:rgba(42,107,255,0.15); border:1px solid #2a6bff; color:#6ea8ff; padding:5px 10px; border-radius:20px; font-size:10px; font-weight:600;}
.state-badge{background:rgba(16,185,129,0.15); border:1px solid #34d399; color:#34d399; padding:5px 10px; border-radius:20px; font-size:10px; font-weight:600; margin-left:6px;}
.container{ max-width:480px; margin:0 auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
.section-title{ font-size:11px; color:#5a6b8a; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin:10px 0 2px 4px; }
.h-box{ background:linear-gradient(180deg,#1c2740,#121a2b); border:1px solid #2a3650; border-radius:14px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.h-left{ display:flex; align-items:center; gap:12px; flex:1; }
.h-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.h-text b{ font-size:13px; color:#fff; font-weight:600; display:block; }
.h-text span{ font-size:10.5px; color:#8a9bb5; }
.h-text small{ font-size:11px; color:#6ea8ff; font-weight:600; display:block; margin-top:2px; }
.call-btn{ background:#ff3b3b; color:#fff; padding:9px 16px; border-radius:25px; font-weight:700; font-size:12px; text-decoration:none; display:flex; align-items:center; gap:6px; flex-shrink:0; }
</style>
</head>
<body>

<div class="topBar">
<div>
<div class="brand-main">Emergency Help - 28 States</div>
<div style="font-size:8px; color:#5a6b8a;">TAP TO CALL INSTANTLY</div>
</div>
<div style="display:flex;">
<div class="badge" id="countryBadge">IN</div>
<div class="state-badge" id="stateBadge">Detecting...</div>
</div>
</div>

<div class="container" id="list"></div>

<script>
const national = [
 {name:"National Emergency ERSS", number:"112", desc:"All India - Police Fire Ambulance", c:"rgba(255,59,59,0.15)", i:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="1.8"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>`},
 {name:"Medical Ambulance", number:"108", desc:"All India Ambulance", c:"rgba(16,185,129,0.15)", i:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>`},
 {name:"Govt Ambulance", number:"102", desc:"Janani Suraksha", c:"rgba(56,189,248,0.15)", i:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8"><path d="M19 14V6a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v8"/></svg>`},
 {name:"Women Helpline", number:"1091", desc:"Women Safety - All India", c:"rgba(168,85,247,0.15)", i:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`},
 {name:"Childline", number:"1098", desc:"Child Emergency", c:"rgba(245,158,11,0.15)", i:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8"><circle cx="12" cy="8" r="5"/><path d="M12 13v7"/></svg>`},
 {name:"Kiran Mental Health", number:"18005990019", desc:"Mental Health 24x7", c:"rgba(99,102,241,0.15)", i:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8"><circle cx="12" cy="12" r="10"/></svg>`},
];

const states = {
"Andhra Pradesh":[{n:"AP Disaster Control",num:"08632441037",d:"AP State Disaster"},{n:"AP Health 104",num:"104",d:"AP Health Helpline"}],
"Arunachal Pradesh":[{n:"Arunachal Disaster",num:"03602214290",d:"State Disaster Control"},{n:"Arunachal Health",num:"104",d:"Health Helpline"}],
"Assam":[{n:"Assam Disaster ASDMA",num:"03612239628",d:"Assam Disaster"},{n:"Assam Health 104",num:"104",d:"Health Helpline"}],
"Bihar":[{n:"Bihar Disaster",num:"06122539285",d:"Bihar State Disaster"},{n:"Bihar Health",num:"104",d:"Health Helpline"}],
"Chhattisgarh":[{n:"CG Disaster",num:"07712235000",d:"Chhattisgarh Disaster"},{n:"CG Health 104",num:"104",d:"Health Helpline"}],
"Goa":[{n:"Goa Disaster",num:"08322410125",d:"Goa State Disaster"},{n:"Goa Health 104",num:"104",d:"Health"}],
"Gujarat":[{n:"Gujarat Disaster",num:"07923259283",d:"Gujarat State Disaster"},{n:"Gujarat Health 104",num:"104",d:"Health Helpline"}],
"Haryana":[{n:"Haryana Disaster",num:"01722710192",d:"Haryana Disaster"},{n:"Haryana Health 108",num:"108",d:"Ambulance Haryana"}],
"Himachal Pradesh":[{n:"HP Disaster",num:"01772620090",d:"HP Disaster"},{n:"HP Health 104",num:"104",d:"Health"}],
"Jharkhand":[{n:"Jharkhand Disaster",num:"06512440323",d:"Jharkhand Disaster"},{n:"Jharkhand Health 104",num:"104",d:"Health"}],
"Karnataka":[{n:"Karnataka Disaster",num:"08022970000",d:"KSNDMC Bangalore"},{n:"Karnataka Arogya",num:"104",d:"Health 104"}],
"Kerala":[{n:"Kerala Disaster KSDMA",num:"04712331163",d:"Kerala Disaster"},{n:"Kerala Health Disha",num:"1056",d:"Health Helpline"}],
"Madhya Pradesh":[{n:"MP Disaster",num:"07552443723",d:"MP State Disaster"},{n:"MP Health 104",num:"104",d:"Health"}],
"Maharashtra":[{n:"Maharashtra Disaster",num:"02222027990",d:"Mumbai HQ Disaster"},{n:"Nagpur Disaster",num:"07122565587",d:"Nagpur City Control"},{n:"Mumbai Ambulance",num:"02224308888",d:"Mumbai Extra"}],
"Manipur":[{n:"Manipur Disaster",num:"03852441502",d:"Manipur Disaster"},{n:"Manipur Health",num:"104",d:"Health"}],
"Meghalaya":[{n:"Meghalaya Disaster",num:"03642222022",d:"Meghalaya Disaster"},{n:"Meghalaya Health",num:"108",d:"Health"}],
"Mizoram":[{n:"Mizoram Disaster",num:"03892342340",d:"Mizoram Disaster"},{n:"Mizoram Health 102",num:"102",d:"Health"}],
"Nagaland":[{n:"Nagaland Disaster",num:"03702290070",d:"Nagaland Disaster"},{n:"Nagaland Health",num:"104",d:"Health"}],
"Odisha":[{n:"Odisha Disaster OSDMA",num:"06742392400",d:"Odisha Disaster"},{n:"Odisha Health 104",num:"104",d:"Health"}],
"Punjab":[{n:"Punjab Disaster",num:"01722741047",d:"Punjab Disaster"},{n:"Punjab Health 104",num:"104",d:"Health"}],
"Rajasthan":[{n:"Rajasthan Disaster",num:"01412228333",d:"Rajasthan Disaster"},{n:"Rajasthan Health 104",num:"104",d:"Health"}],
"Sikkim":[{n:"Sikkim Disaster",num:"03592221011",d:"Sikkim Disaster"},{n:"Sikkim Health",num:"104",d:"Health"}],
"Tamil Nadu":[{n:"TN Disaster",num:"04428593990",d:"TN Disaster Control"},{n:"TN Health 104",num:"104",d:"TN Health"}],
"Telangana":[{n:"Telangana Disaster",num:"04023440888",d:"Telangana Disaster"},{n:"Telangana Health 104",num:"104",d:"Health"}],
"Tripura":[{n:"Tripura Disaster",num:"03812383142",d:"Tripura Disaster"},{n:"Tripura Health",num:"102",d:"Health"}],
"Uttar Pradesh":[{n:"UP Disaster",num:"05222233330",d:"UP State Disaster"},{n:"UP Health 18001805145",num:"18001805145",d:"UP Health"}],
"Uttarakhand":[{n:"UK Disaster",num:"01332711693",d:"Uttarakhand Disaster"},{n:"UK Health 104",num:"104",d:"Health"}],
"West Bengal":[{n:"WB Disaster",num:"03322143526",d:"WB State Disaster"},{n:"WB Health",num:"18003450110",d:"WB Health"}],
"Delhi":[{n:"Delhi Disaster",num:"01122307145",d:"Delhi Disaster Authority"},{n:"Delhi Health",num:"01122307133",d:"Delhi Health"}],
};

function box(item){
 let color = item.c || "rgba(16,185,129,0.15)";
 let icon = item.i || `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`;
 return `<div class="h-box"><div class="h-left"><div class="h-icon" style="background:${color}">${icon}</div><div class="h-text"><b>${item.name||item.n}</b><span>${item.desc||item.d}</span><small>${item.number||item.num}</small></div></div><a class="call-btn" href="tel:${item.number||item.num}">📞 Call</a></div>`;
}

function stateBox(s){
 let c1 = "rgba(245,158,11,0.15)"; let c2 = "rgba(56,189,248,0.15)";
 return `<div class="h-box"><div class="h-left"><div class="h-icon" style="background:${c1}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><div class="h-text"><b>${s.n}</b><span>${s.d}</span><small>${s.num}</small></div></div><a class="call-btn" href="tel:${s.num}">📞 Call</a></div>`;
}

async function getState(){
 let state="Maharashtra";
 try{
  let ip = await fetch('https://ipapi.co/json/').then(r=>r.json());
  state = ip.region || "Maharashtra";
  if(navigator.geolocation){
   let pos = await new Promise((res, rej)=> navigator.geolocation.getCurrentPosition(res, rej, {timeout:5000}));
   let rev = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`).then(r=>r.json());
   if(rev.address && rev.address.state) state = rev.address.state;
  }
 }catch(e){}
 // Normalize
 if(state.toLowerCase().includes("maharashtra")) state="Maharashtra";
 if(state.toLowerCase().includes("delhi")) state="Delhi";
 if(state.toLowerCase().includes("uttar pradesh")) state="Uttar Pradesh";
 if(state.toLowerCase().includes("tamil nadu")) state="Tamil Nadu";
 if(state.toLowerCase().includes("west bengal")) state="West Bengal";
 if(state.toLowerCase().includes("madhya pradesh")) state="Madhya Pradesh";
 if(state.toLowerCase().includes("andhra")) state="Andhra Pradesh";
 if(state.toLowerCase().includes("karnataka")) state="Karnataka";
 if(state.toLowerCase().includes("kerala")) state="Kerala";
 if(state.toLowerCase().includes("gujarat")) state="Gujarat";
 if(state.toLowerCase().includes("rajasthan")) state="Rajasthan";
 return state;
}

async function render(){
 let state = await getState();
 document.getElementById('stateBadge').innerText = state;
 document.getElementById('countryBadge').innerText = "IN - 28 States";

 let html = `<div class="section-title">🇮🇳 National - All India Same</div>`;
 national.forEach(n=> html += box(n));

 if(states[state]){
   html += `<div class="section-title">📍 ${state} - State Extra Numbers</div>`;
   states[state].forEach(s=> html += stateBox(s));
 }else{
   html += `<div class="section-title">📍 ${state} - National numbers work here (State extra coming soon)</div>`;
   // Show Maharashtra as fallback example
   html += `<div class="section-title">📍 Maharashtra Example Extra</div>`;
   states["Maharashtra"].forEach(s=> html += stateBox(s));
 }

 document.getElementById('list').innerHTML = html;
}
render();
</script>
</body>
</html>
