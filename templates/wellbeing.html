function toggleMenu(){
 const d=document.getElementById('drawer'), o=document.getElementById('overlay');
 if(d.style.left==='0px'){d.style.left='-100%'; o.style.display='none';}
 else{d.style.left='0px'; o.style.display='block';}
}
function loadTopic(key){
 const arts=DATA[key]||[];
 document.getElementById('bigHeading').innerHTML=TOPICS[key].toUpperCase()+' <span>12 EXPERT PLANS</span>';
 document.getElementById('heroImg').style.backgroundImage='url('+(HERO_PHOTOS[key]||HERO_PHOTOS['diet'])+')';
 document.getElementById('articles').innerHTML=arts.map(a=>`
  <div class="block">
   <div class="text">
    <span class="tag tag-${a.c}">${a.t}</span>
    <h3>${a.h}</h3>
    <p>${a.p}</p>
    <div class="plan">💡 Plan: ${a.d}</div>
   </div>
   <div class="img" style="background-image:url('${a.img}')"></div>
  </div>
 `).join('');
 document.querySelectorAll('.drawer-item').forEach(el=>el.classList.remove('active'));
 const active=document.querySelector(`[data-key="${key}"]`);
 if(active) active.classList.add('active');
 if(window.innerWidth<900) toggleMenu();
 window.scrollTo(0,0);
}
const list=document.getElementById('list');
Object.keys(TOPICS).forEach(k=>{
 const div=document.createElement('div');
 div.className='drawer-item'; div.dataset.key=k; div.textContent=TOPICS[k];
 div.onclick=()=>loadTopic(k);
 list.appendChild(div);
});
loadTopic('diet');
</script></body></html>
