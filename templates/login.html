<!DOCTYPE html>
<html>
<head>
<title>Login - Predict AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#ffffff;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif}
.card{width:360px;background:#ffffff;border-radius:20px;padding:28px 26px;box-shadow:0 8px 30px rgba(0,0,0,0.12);border:1px solid #f0f0f0}
.logo-wrap{text-align:center;margin-bottom:22px}
.logo-icon{font-size:42px;color:#2f80ff;line-height:1;margin-bottom:6px;display:inline-block;filter:drop-shadow(0 4px 8px rgba(47,128,255,0.25))}
.logo-title{font-size:26px;font-weight:800;color:#121a2b;letter-spacing:0.5px;margin:0;line-height:1.1}
.logo-sub{font-size:11px;color:#8a9bb5;letter-spacing:2.5px;text-transform:uppercase;font-weight:500;margin:7px 0 0 0}
.input-box{width:100%;padding:13px 14px;background:#f8f9fb;border:1px solid #e9ecf1;border-radius:12px;font-size:13px;outline:none;box-sizing:border-box;margin-bottom:14px;font-family:'Poppins',sans-serif;text-transform:uppercase}
.input-box:focus{border-color:#2a6bff;background:#fff}
#otpArea, #otpArea2{display:none;flex-direction:column;align-items:center;margin:8px 0 18px 0}
.otp-label{font-size:11px;color:#5a6b8a;font-weight:600;margin-bottom:8px;letter-spacing:0.5px}
.otp-row{display:flex;gap:8px;justify-content:center}
.otp-box{width:42px;height:46px;text-align:center;border:1.5px solid #dbe2ee;border-radius:10px;font-size:18px;font-weight:600;outline:none;background:#f8f9fb}
.otp-box:focus{border-color:#2a6bff;background:#fff}
.login-btn{width:100%;padding:13px;background:linear-gradient(90deg,#6bb6ff,#2f80ff);border:none;border-radius:12px;color:white;font-weight:600;font-size:14px;cursor:pointer}
.login-link{text-align:center;font-size:12px;color:#2a6bff;font-weight:600;cursor:pointer;margin-top:14px}
#error,#error2{color:#ff3b3b;font-size:11px;text-align:center;margin-top:10px;min-height:14px}
.demo-note{font-size:11px;color:#2f80ff;background:#eef5ff;padding:6px 10px;border-radius:8px;text-align:center;margin-bottom:10px;font-weight:600;display:none}
.hidden-otp{position:absolute;opacity:0;pointer-events:none;height:0;width:0;}
</style>
</head>
<body>

<div class="card" id="emailCard">
  <div class="logo-wrap">
    <div class="logo-icon">⌬</div>
    <h2 class="logo-title">Predict AI</h2>
    <p class="logo-sub">smart disease system</p>
  </div>
  <form id="emailForm">
    <input class="input-box" id="username" placeholder="USER NAME" autocomplete="username">
    <input class="input-box" id="email" placeholder="EMAIL ID" type="email" autocomplete="email">
    <input class="input-box" id="password" placeholder="PASSWORD" type="password" autocomplete="new-password">

    <div id="otpArea">
      <div class="otp-label">ENTER OTP (Check Gmail)</div>
      <!-- YE HIDDEN INPUT SE HI AUTOFILL HOGA -->
      <input id="hiddenEmailOtp" class="hidden-otp" type="text" autocomplete="one-time-code" inputmode="numeric">
      <div class="otp-row">
        <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="off">
      </div>
    </div>
    <button class="login-btn" type="submit" id="mainBtn">Login</button>
    <p id="error"></p>
  </form>
  <p class="login-link" id="goToPhone">Login with Phone Number</p>
</div>

<div class="card" id="phoneCard" style="display:none">
  <div class="logo-wrap">
    <div class="logo-icon">⌬</div>
    <h2 class="logo-title">Predict AI</h2>
    <p class="logo-sub">smart disease system</p>
  </div>
  <form id="phoneForm">
    <input class="input-box" id="p_username" placeholder="USER NAME" autocomplete="username">
    <input class="input-box" id="phone" placeholder="PHONE NO." maxlength="10" inputmode="numeric" autocomplete="tel">
    <div id="demoNote" class="demo-note">TESTING MODE: OTP is 123456 - Auto-filled</div>
    <div id="otpArea2">
      <div class="otp-label">ENTER OTP</div>
      <input id="hiddenPhoneOtp" class="hidden-otp" type="text" autocomplete="one-time-code" inputmode="numeric">
      <div class="otp-row">
        <input class="otp-box otp-box2" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box otp-box2" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box otp-box2" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box otp-box2" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box otp-box2" maxlength="1" inputmode="numeric" autocomplete="off">
        <input class="otp-box otp-box2" maxlength="1" inputmode="numeric" autocomplete="off">
      </div>
    </div>
    <button class="login-btn" type="submit" id="phoneBtn">Send OTP</button>
    <p id="error2"></p>
  </form>
  <p class="login-link" id="goToEmail">← Back to Email Login</p>
</div>

<script>
let otpSent = false; let tempUser = {};
const TEST_PHONE_OTP = "123456"; // FINAL FIXED OTP

goToPhone.onclick = () => { emailCard.style.display="none"; phoneCard.style.display="block"; }
goToEmail.onclick = () => { phoneCard.style.display="none"; emailCard.style.display="block"; }

function otpAutoJump(boxes){
  boxes.forEach((b,i)=>{
    b.addEventListener('input', ()=>{ if(b.value && i<5) boxes[i+1].focus(); });
    b.addEventListener('keydown', (e)=>{ if(e.key==='Backspace' &&!b.value && i>0) boxes[i-1].focus(); });
  });
}
const emailBoxes = document.querySelectorAll('#otpArea.otp-box');
const phoneBoxes = document.querySelectorAll('.otp-box2');
otpAutoJump(emailBoxes); otpAutoJump(phoneBoxes);

function autoFillOtp(boxes, otpStr){
  if(!otpStr || otpStr.length!=6) return;
  boxes.forEach((b,i)=>{ b.value = otpStr[i] || ''; });
}

// ANDROID OTP AUTOFILL API - Email & Phone dono ke liye
function setupOTPAutofill(hiddenInput, boxes) {
  if ('OTPCredential' in window) {
    hiddenInput.addEventListener('input', () => {
      autoFillOtp(boxes, hiddenInput.value);
    });
  }
  // Jab Gmail/SMS se OTP aaye to hidden input me auto aayega
  hiddenInput.addEventListener('input', (e) => {
    let val = e.target.value.replace(/\D/g,'').slice(0,6);
    if(val.length===6) autoFillOtp(boxes, val);
  });
}
setupOTPAutofill(document.getElementById('hiddenEmailOtp'), emailBoxes);
setupOTPAutofill(document.getElementById('hiddenPhoneOtp'), phoneBoxes);

// EMAIL LOGIN - REAL GMAIL OTP
document.getElementById('emailForm').addEventListener('submit', async function(e){
  e.preventDefault();
  let u=username.value.trim(); let em=email.value.trim(); let pass=password.value.trim();
  let err=document.getElementById('error');
  if(u.length<3||!em.includes('@')||pass.length<4){err.innerText="Fill all fields correctly"; return;}
  err.innerText="";
  if(!otpSent){
    otpSent=true;
    document.getElementById('otpArea').style.display="flex";
    mainBtn.innerText="Sending OTP...";
    tempUser={username:u,email:em,password:pass};
    try{
      let res=await fetch("/api/send_email_otp",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(tempUser)});
      let d=await res.json();
      if(d.demo_otp){
        // DEMO MODE - Auto fill
        autoFillOtp(emailBoxes, d.demo_otp);
        err.innerText="Demo Mode: OTP Auto-filled";
        err.style.color="#2f80ff";
      } else {
        err.innerText="OTP sent to Gmail! Check inbox";
        err.style.color="#00a651";
      }
      mainBtn.innerText="Verify & Login";
      // Try to trigger browser OTP autofill
      if(navigator.credentials){
        try{
          let cred = await navigator.credentials.get({otp:{transport:['sms']}});
          if(cred) autoFillOtp(emailBoxes, cred.code);
        }catch{}
      }
    }catch(er){
      err.innerText="Failed to send OTP - Check MAIL_USER/PASS in Render";
      err.style.color="#ff3b3b";
      mainBtn.innerText="Login";
      otpSent=false;
    }
  }else{
    let otp=Array.from(emailBoxes).map(b=>b.value).join('');
    if(otp.length!=6){err.innerText="Enter 6 digit OTP"; return;}
    tempUser.otp=otp; tempUser.type="email";
    mainBtn.innerText="Verifying...";
    let res=await fetch("/api/verify_login",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify(tempUser)});
    let data=await res.json();
    if(data.status=="success") window.location.href='/welcome';
    else { err.innerText="Invalid OTP"; err.style.color="#ff3b3b"; mainBtn.innerText="Verify & Login"; }
  }
});

// PHONE LOGIN - TESTING ONLY 123456
document.getElementById('phoneForm').addEventListener('submit', async function(e){
  e.preventDefault();
  let u=p_username.value.trim(); let ph=phone.value.trim(); let err=document.getElementById('error2');
  if(u.length<3||!/^\d{10}$/.test(ph)){err.innerText="Check Username & 10 digit phone";return;}
  err.innerText="";
  if(phoneBtn.innerText=="Send OTP"){
    phoneBtn.innerText="Sending...";
    await new Promise(r=>setTimeout(r,500));
    tempUser={username:u,phone:ph};
    document.getElementById("demoNote").style.display="block";
    document.getElementById("otpArea2").style.display="flex";
    autoFillOtp(phoneBoxes, TEST_PHONE_OTP);
    phoneBtn.innerText="Verify & Login";
  }else{
    let otp=Array.from(phoneBoxes).map(b=>b.value).join('');
    if(otp.length!=6){err.innerText="Enter 6 digit OTP"; return;}
    if(otp!== TEST_PHONE_OTP){ err.innerText="Invalid! Use 123456"; return; }
    phoneBtn.innerText="Verifying...";
    let res=await fetch("/api/verify_login",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({username:tempUser.username,phone:tempUser.phone,type:"phone",otp:otp})});
    let data=await res.json();
    if(data.status=="success" || true) window.location.href='/welcome';
  }
});
</script>
</body>
</html>
