<!DOCTYPE html>
<html>
<head>
    <title>Cover - Predict AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }
        a {
            display: block;
            width: 100vw;
            height: 100vh;
            text-decoration: none;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <a href="/login">
        <img src="/static/cover-bg.jpg" alt="Cover">
    </a>

<script>
    // Bina loader ke 10 sec baad auto redirect to /login
    setTimeout(function(){
        window.location.href = "/login";
    }, 10000); // 10000 = 10 seconds
</script>
</body>
</html>
